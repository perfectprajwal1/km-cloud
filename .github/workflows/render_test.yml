name: Render speed test

on:
  workflow_dispatch:

jobs:
  render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Machine info
        run: |
          echo "cores: $(nproc)"
          grep -m1 'model name' /proc/cpuinfo
          free -h | sed -n 1,2p
          df -h / | tail -1
          cat /etc/os-release | head -2
          node -v
          ffmpeg -version | head -1

      - name: Install Chrome libraries
        run: |
          sudo apt-get update -y >/dev/null 2>&1
          for p in libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2t64 libcairo2 libpango-1.0-0 fonts-noto-core; do
            sudo apt-get install -y $p >/dev/null 2>&1 || echo "apt FAILED: $p"
          done
          sudo apt-get install -y libasound2t64 >/dev/null 2>&1 || echo "apt FAILED: libasound2t64"

      - name: Install Remotion 4.0.242
        run: |
          mkdir -p $HOME/kmtest/src $HOME/kmtest/out
          cd $HOME/kmtest
          cat > package.json <<'J'
          {"name":"kmtest","version":"1.0.0","private":true,"dependencies":{"remotion":"4.0.242","@remotion/cli":"4.0.242","@remotion/renderer":"4.0.242","@remotion/bundler":"4.0.242","react":"18.3.1","react-dom":"18.3.1"}}
          J
          S=$(date +%s)
          npm install --no-audit --no-fund
          echo "npm install took $(( $(date +%s)-S ))s"
          S=$(date +%s)
          npx remotion browser ensure
          echo "chrome download took $(( $(date +%s)-S ))s"

      - name: Write stress card (blur, shadows, gradients, counters)
        run: |
          cd $HOME/kmtest
          cat > src/index.jsx <<'J'
          import React from 'react';
          import {registerRoot, Composition, useCurrentFrame, interpolate, AbsoluteFill} from 'remotion';
          const Card = () => {
            const f = useCurrentFrame();
            const x = interpolate(f, [0, 240], [0, 100]);
            const rows = Array.from({length: 14});
            return (
              <AbsoluteFill style={{background: 'radial-gradient(circle at ' + (30 + f / 4) + '% 30%, #1b3a6b, #050b18)', color: '#fff', fontFamily: 'Noto Sans, sans-serif', padding: 60}}>
                {rows.map((_, i) => (
                  <div key={i} style={{margin: '14px 0', padding: 30, borderRadius: 28, background: 'linear-gradient(90deg, rgba(255,255,255,.12), rgba(255,212,0,.18))', boxShadow: '0 20px 60px rgba(0,0,0,.7)', textShadow: '0 6px 24px #000', filter: 'blur(' + Math.max(0, (i * 3 - f) / 10) + 'px) drop-shadow(0 10px 20px #000)', transform: 'translateX(' + (Math.sin((f + i * 9) / 12) * 40) + 'px) scale(' + (1 + Math.sin((f + i * 5) / 20) * 0.03) + ')', fontSize: 56, fontWeight: 800}}>
                    {Math.round(x * (i + 1) * 1000).toLocaleString()} - Khabar Minute {i}
                  </div>
                ))}
              </AbsoluteFill>
            );
          };
          registerRoot(() => <Composition id="T" component={Card} durationInFrames={240} fps={30} width={1080} height={1920} />);
          J

      - name: Render 240 frames (timed alone)
        run: |
          cd $HOME/kmtest
          S=$(date +%s)
          npx remotion render src/index.jsx T out/test.mp4 --codec=h264 --concurrency=$(nproc) --log=info > /tmp/render.log 2>&1
          RC=$?
          RT=$(( $(date +%s)-S ))
          tail -8 /tmp/render.log
          echo "$RC" > /tmp/render_rc
          echo "$RT" > /tmp/render_secs
          if [ "$RC" != 0 ]; then echo "RENDER FAILED, log above"; fi

      - name: Encode (libx264 + loudnorm + aac, timed alone)
        run: |
          cd $HOME/kmtest
          ffmpeg -y -loglevel error -f lavfi -i "sine=frequency=440:duration=8" out/a.wav
          S=$(date +%s)
          ffmpeg -y -loglevel error -i out/test.mp4 -i out/a.wav -map 0:v -map 1:a -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -af loudnorm=I=-14:TP=-1.5:LRA=11 -c:a aac -b:a 192k -shortest -map_metadata -1 -fflags +bitexact -movflags +faststart out/final.mp4
          echo "$?" > /tmp/enc_rc
          echo "$(( $(date +%s)-S ))" > /tmp/enc_secs
          ls -la out/final.mp4

      - name: Summary
        if: always()
        run: |
          RC=$(cat /tmp/render_rc 2>/dev/null || echo X)
          RT=$(cat /tmp/render_secs 2>/dev/null || echo 0)
          EC=$(cat /tmp/enc_rc 2>/dev/null || echo X)
          ET=$(cat /tmp/enc_secs 2>/dev/null || echo 0)
          {
            echo "## Render test summary"
            echo "cores: $(nproc)"
            if [ "$RC" = 0 ]; then echo "PASS render: 240 frames in ${RT}s"; else echo "FAIL render (exit $RC)"; fi
            if [ "$EC" = 0 ]; then echo "PASS encode: ${ET}s"; else echo "FAIL encode (exit $EC)"; fi
            if [ "$RC" = 0 ] && [ "$RT" -gt 0 ]; then
              echo "speed: $(awk -v t=$RT 'BEGIN{printf "%.2f", t/240}') s per frame"
              echo "estimate for 1437 frames: $(awk -v t=$RT 'BEGIN{printf "%.1f", 1437*t/240/60}') min (stress card, lower bound for real cards)"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
