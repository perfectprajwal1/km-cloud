name: KM reel

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: "Story id, for example RV_20261010_n5twyq"
        required: true
      mode:
        description: "make = new story, resume = continue a story that stopped on voice"
        required: true
        default: make
        type: choice
        options:
          - make
          - resume

permissions:
  contents: write

concurrency:
  group: km-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STORY: ${{ github.event.inputs.story_id }}
      MODE: ${{ github.event.inputs.mode }}
    steps:
      - name: Check inputs
        run: |
          case "$STORY" in
            RV_*[!A-Za-z0-9_-]*|"") echo "Bad story id"; exit 1;; esac
          echo "story: $STORY, mode: $MODE"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries and ffmpeg
        run: |
          sudo apt-get update -y >/dev/null 2>&1
          for p in ffmpeg libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2t64 libcairo2 libpango-1.0-0 fonts-noto-core; do
            sudo apt-get install -y $p >/dev/null 2>&1 || echo "apt FAILED: $p"
          done
          sudo apt-get install -y libasound2t64 >/dev/null 2>&1 || echo "apt FAILED: libasound2t64"
          ffmpeg -version | head -1
          ffmpeg -hide_banner -filters 2>/dev/null | grep -cE ' (subtitles|ass) ' | sed 's/^/subtitles filters: /'

      - name: Python packages
        run: |
          pip install --no-input edge-tts playwright pillow numpy scipy onnxruntime >/dev/null
          python -m playwright install --with-deps chromium >/dev/null 2>&1 || python -m playwright install chromium
          pip list 2>/dev/null | grep -iE 'onnxruntime|playwright|edge-tts|numpy|scipy|pillow'

      - name: Node packages (cached)
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: |
          [ -d node_modules/remotion ] || npm ci --no-audit --no-fund
          npx remotion browser ensure

      - name: Voice-check model (from the models-v1 release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f models/km_nepali_ctc/nepali_int8_weights.bin ]; then
            gh release download models-v1 --pattern 'km_nepali_ctc.zip' --dir /tmp
            mkdir -p models
            unzip -q /tmp/km_nepali_ctc.zip -d models
          fi
          ls -la models/km_nepali_ctc | head

      - name: Cloud setting - software graphics (no GPU on the runner)
        run: |
          grep -n "gl=" scripts/render.mjs | cut -c1-120
          sed -i "s/'--gl=angle'/'--gl=swangle'/" scripts/render.mjs
          sed -i "s/setChromiumOpenGlRenderer('angle')/setChromiumOpenGlRenderer('swangle')/" remotion.config.ts
          grep -n "swangle" scripts/render.mjs remotion.config.ts | cut -c1-120

      - name: Put Gemini keys on this runner only
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_KEY2: ${{ secrets.GEMINI_KEY2 }}
        run: |
          if [ -z "$GEMINI_KEY" ] || [ -z "$GEMINI_KEY2" ]; then echo "Secret GEMINI_KEY or GEMINI_KEY2 is empty"; exit 1; fi
          umask 077
          printf '%s' "$GEMINI_KEY" > gemini_key.txt
          printf '%s' "$GEMINI_KEY2" > gemini_key2.txt
          echo "key files written (not shown)"

      - name: Run the reel (voice, render, loudness, outro)
        run: |
          set +e
          S=$(date +%s)
          if [ "$MODE" = resume ]; then
            python resume_failed.py "$STORY" 2>&1 | tee /tmp/km_run.log
          else
            python make_reel.py "$STORY" 2>&1 | tee /tmp/km_run.log
          fi
          RC=${PIPESTATUS[0]}
          echo "$RC" > /tmp/km_rc
          echo "$(( $(date +%s)-S ))" > /tmp/km_secs
          [ -s "out/$STORY.mp4" ] && echo ok > /tmp/km_ok
          exit 0

      - name: Remove key files
        if: always()
        run: rm -f gemini_key.txt gemini_key2.txt pexels_key.txt

      - name: Save voice progress back to the repo
        if: always()
        run: |
          git config user.name "km-cloud"
          git config user.email "km-cloud@users.noreply.github.com"
          if [ -f /tmp/km_ok ]; then
            echo "reel done, dropping its voice cache from the repo"
            git rm -r -q --ignore-unmatch one_call_voice || true
            rm -rf one_call_voice
          else
            git add one_call_voice
          fi
          git add stories inbox produced.json 2>/dev/null
          git diff --cached --quiet || git commit -q -m "state after $STORY ($MODE)"
          git pull -q --rebase || true
          git push -q || echo "push failed"

      - name: Save the mp4 as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.event.inputs.story_id }}
          path: out/${{ github.event.inputs.story_id }}.mp4
          retention-days: 3
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          RC=$(cat /tmp/km_rc 2>/dev/null || echo X)
          SECS=$(cat /tmp/km_secs 2>/dev/null || echo 0)
          {
            echo "## KM reel summary"
            echo "story: $STORY | mode: $MODE | cores: $(nproc)"
            if [ -f /tmp/km_ok ]; then echo "PASS: mp4 made in ${SECS}s. Download it from Artifacts at the bottom of this page."; else echo "NOT DONE (exit $RC) after ${SECS}s. Voice progress is saved. Last lines:"; tail -25 /tmp/km_run.log 2>/dev/null; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
