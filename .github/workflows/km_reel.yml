# v5.7: fresh-main checkout, isolated conflict-aware state commits, durable claims, one notification per reel.
# v5.6: connected Buffer channels; durable per-platform receipts; dry-run is read-only.
# v5.5 (2026-10-12): TikTok auto-post. After the Drive upload and done-marking, each new reel is copied to the public repo km-media (GitHub Pages), the run waits until its URL serves the mp4, then Buffer posts it to the TikTok channel (caption from the package with the source line removed, max 5 hashtags). Soft step: any failure only sends a WhatsApp notice, the render and the Drive copy are untouched. Needs secrets BUFFER_API_KEY and GH_PAT; without them the step is skipped. Nothing else changed.
# v5.4.1 (2026-10-12): done-marking was silently lost - git pull --rebase died on unstaged changes and the push never happened, so uploaded reels were never marked done and every run re-rendered them (and the WhatsApp text was the only step that fired... into a Meta error). Fix: git add -u stages every tracked change before commit, rebase failures abort cleanly, push retries 3x then turns the run red instead of failing silently.
# v5.4 (2026-10-11): auto-start + safe finish. 30-min schedule + queue:max (a tick never cancels a render). make_reel.py now batches ALL unfinished inbox stories (oldest first, max 5 per run) so the old auto-continue step is gone. done.txt is written ONLY after the Drive upload succeeds (fixes the sgh2kr hole: marked done with the mp4 stuck in Artifacts). Drive re-upload is skipped if the file already exists. WhatsApp message per finished reel (id + title) and one on failure; needs secrets WA_TOKEN, WA_PHONE_ID, WA_TO - without them the messages are skipped, nothing fails. Run timeout 180 -> 350 min for multi-reel runs.
# v5.3.2 (2026-10-11): Drive upload fixed. The token ask is now 2 steps (POST, read Google's redirect, wait 2s, GET the answer) because curl -L gets Google's HTML error page instead of the script JSON. Proven green in the KM Drive test run.
# v5.3 (2026-10-11): v5.1 + zero-click resume, Opus-reviewed: when story id is empty, the OLDEST unfinished inbox/ story (folder exists, no nonzero out/<id>.mp4) is auto-continued through the normal make path (make_reel.py rebuilds a missing stories/<id>.json from inbox/ by itself - verified in source) before the Sheet is asked for new rows.
# Watchdog marks by process signature (chrome/ffmpeg/voice-prep) as telemetry; explicit MARK lines are the source of truth. Pipeline code itself is NOT touched.
name: KM reel

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: "Story id, e.g. RV_20261011_abc123. Leave EMPTY to fetch newly approved rows from the Sheet (make only)."
        required: false
        default: ""
      mode:
        description: "make = new story, resume = continue a story that stopped on voice"
        required: true
        default: make
        type: choice
        options:
          - make
          - resume
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: km-reel
  cancel-in-progress: false
  queue: max

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      STORY: ${{ github.event.inputs.story_id }}
      MODE: ${{ github.event.inputs.mode || 'make' }}
    steps:
      - name: Check inputs
        run: |
          case "$STORY" in
            *[!A-Za-z0-9_-]*) echo "Bad story id"; exit 1;; esac
          if [ -z "$STORY" ] && [ "$MODE" = resume ]; then echo "resume needs a story id"; exit 1; fi
          echo "story: ${STORY:-(new rows from the Sheet)}, mode: $MODE"



      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Start from latest main after queue wait
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git checkout -B main origin/main
          git config user.name "km-cloud"
          git config user.email "km-cloud@users.noreply.github.com"
          echo "Latest main: $(git rev-parse HEAD)"
          test -f scripts/km_state.py || { echo "Install incomplete: state helper missing"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries and ffmpeg
        run: |
          sudo apt-get update -y >/dev/null 2>&1
          for p in ffmpeg libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2t64 libcairo2 libpango-1.0-0 fonts-noto-core; do
            sudo apt-get install -y $p >/dev/null 2>&1 || echo "apt FAILED: $p"
          done
          sudo apt-get install -y libasound2t64 >/dev/null 2>&1 || echo "apt FAILED: libasound2t64"
          ffmpeg -version | head -1
          ffmpeg -hide_banner -filters 2>/dev/null | grep -cE ' (subtitles|ass) ' | sed 's/^/subtitles filters: /'

      - name: Python packages
        run: |
          pip install --no-input edge-tts playwright pillow numpy scipy onnxruntime >/dev/null
          python -m playwright install --with-deps chromium >/dev/null 2>&1 || python -m playwright install chromium
          pip list 2>/dev/null | grep -iE 'onnxruntime|playwright|edge-tts|numpy|scipy|pillow'

      - name: Node packages (cached)
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: |
          [ -d node_modules/remotion ] || npm ci --no-audit --no-fund
          npx remotion browser ensure

      - name: Voice-check model (from the models-v1 release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f models/km_nepali_ctc/nepali_int8_weights.bin ]; then
            gh release download models-v1 --pattern 'km_nepali_ctc.zip' --dir /tmp
            mkdir -p models
            unzip -q /tmp/km_nepali_ctc.zip -d models
          fi
          ls -la models/km_nepali_ctc | head

      - name: Cloud setting - software graphics (no GPU on the runner)
        run: |
          grep -n "gl=" scripts/render.mjs | cut -c1-120
          sed -i "s/'--gl=angle'/'--gl=swangle'/" scripts/render.mjs
          sed -i "s/setChromiumOpenGlRenderer('angle')/setChromiumOpenGlRenderer('swangle')/" remotion.config.ts
          grep -n "swangle" scripts/render.mjs remotion.config.ts | cut -c1-120
          grep -q "swangle" scripts/render.mjs || echo "WARN: swangle sed did not apply to render.mjs - check the sed pattern still matches"

      - name: Put Gemini keys on this runner only
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_KEY2: ${{ secrets.GEMINI_KEY2 }}
        run: |
          if [ -z "$GEMINI_KEY" ] || [ -z "$GEMINI_KEY2" ]; then echo "Secret GEMINI_KEY or GEMINI_KEY2 is empty"; exit 1; fi
          umask 077
          printf '%s' "$GEMINI_KEY" > gemini_key.txt
          printf '%s' "$GEMINI_KEY2" > gemini_key2.txt
          echo "key files written (not shown)"

      - name: Run the reel (voice, render, loudness, outro)
        run: |
          set +e
          cat > /tmp/km_watch.sh <<'W'
          #!/bin/bash
          # KM watchdog v5.2: read-only sampler + stage transitions by process signature. Never kills anything.
          # chrome = card-building OR render (cards ~6s, render ~80min - duration tells them apart); ffmpeg = stitch/loudness.
          LOG=/tmp/km_watch.log
          STAGE=""; CAND=""; CNT=0; DONE=0
          echo "MARK watchdog-start $(date -u +%H:%M:%S)" >> "$LOG"
          while true; do
            TS=$(date -u +%H:%M:%S)
            PIDS=$(pgrep -f 'make_reel|resume_failed|producer' 2>/dev/null | tr '\n' ' ')
            LINE=$(tail -1 /tmp/km_run.log 2>/dev/null | tr '\n' ' ' | cut -c1-90)
            DISK=$(df -m / | awk 'NR==2{print $4"MB-free"}')
            TOP=$(ps -eo comm=,pcpu=,rss= --sort=-pcpu 2>/dev/null | head -4 | awk '{printf "%s(%s%%,%dMB) ",$1,$2,$3/1024}')
            if [ -n "$PIDS" ]; then
              FDS=$(ls /proc/$(echo $PIDS | cut -d" " -f1)/fd 2>/dev/null | wc -l)
              PST=$(ps -o pid=,stat=,etime= -p $PIDS 2>/dev/null | tr '\n' ' ')
              echo "$TS PIPE-alive fds=$FDS $DISK | $PST| $TOP| $LINE" >> "$LOG"
              if pgrep -f 'chrome|headless' >/dev/null 2>&1; then NS=chrome
              elif pgrep -f ffmpeg >/dev/null 2>&1; then NS=ffmpeg
              else NS=voice-prep; fi
            else
              echo "$TS PIPE-GONE $DISK | $TOP| $LINE" >> "$LOG"
              NS=""
              if [ -n "$STAGE" ]; then echo "$TS MARK $STAGE-end (pipeline gone)" >> "$LOG"; STAGE=""; fi
              if [ "$DONE" = 0 ] && ls out/*.mp4 >/dev/null 2>&1; then
                echo "$TS MARK final-success file=$(ls out/*.mp4 | head -1)" >> "$LOG"; DONE=1
              fi
            fi
            if [ -n "$NS" ]; then
              if [ "$NS" = "$STAGE" ]; then CAND=""; CNT=0
              elif [ "$NS" = "$CAND" ]; then CNT=$((CNT+1))
                if [ "$CNT" -ge 1 ]; then
                  [ -n "$STAGE" ] && echo "$TS MARK $STAGE-end" >> "$LOG"
                  echo "$TS MARK $NS-start pid=$PIDS" >> "$LOG"
                  STAGE=$NS; CAND=""; CNT=0
                fi
              else CAND=$NS; CNT=0; fi
            fi
            sleep 10
          done
          W
          chmod +x /tmp/km_watch.sh
          echo "MARK run-start $(date -u +%H:%M:%S)" | tee -a /tmp/km_run.log
          /tmp/km_watch.sh & WPID=$!
          trap 'rc=$?; echo "MARK step-exit rc=$rc $(date -u +%H:%M:%S)" >> /tmp/km_watch.log; kill $WPID 2>/dev/null; wait $WPID 2>/dev/null' EXIT
          S=$(date +%s)
          python scripts/km_state.py refresh-done || { echo 1 > /tmp/km_rc; exit 1; }
          if [ -n "$STORY" ] && grep -qFx "$STORY" out/done.txt; then
            echo "Already in Drive on latest main: $STORY. No render or repeated ready alert."
            echo 0 > /tmp/km_rc; echo ok > /tmp/km_ok; echo "$STORY" > /tmp/km_already_done; exit 0
          fi
          if [ "$MODE" = resume ]; then
            [ -d "inbox/$STORY" ] || { echo "STOP: inbox/$STORY is not in the repo, nothing to resume."; echo 2 > /tmp/km_rc; exit 0; }
            python resume_failed.py "$STORY" 2>&1 | tee /tmp/km_run.log
          elif [ -z "$STORY" ]; then
            echo "No story id: asking the Sheet for newly approved rows"
            python make_reel.py 2>&1 | tee /tmp/km_run.log
          elif [ -d "inbox/$STORY" ]; then
            python make_reel.py "$STORY" 2>&1 | tee /tmp/km_run.log
          else
            echo "inbox/$STORY is not in the repo; checking the Sheet for it"
            python producer.py --once 2>&1 | tee /tmp/km_run.log
            if [ -d "inbox/$STORY" ]; then
              python make_reel.py "$STORY" 2>&1 | tee -a /tmp/km_run.log
            elif [ -f "stories/$STORY.json" ]; then
              echo "Hand-made story file found; skipping the script converter (voice + render only)"
              python -c "import os,sys; sys.path.insert(0,'.'); import make_reel; sys.exit(make_reel.voice_and_render(os.environ['STORY'], recover=True))" 2>&1 | tee -a /tmp/km_run.log
            else
              echo "STOP: $STORY is not in inbox/, not newly approved in the Sheet, and has no stories/$STORY.json."
              echo "If the row was already made on the PC, upload its inbox/$STORY folder or delete its line in produced.json."
              echo 2 > /tmp/km_rc; exit 0
            fi
          fi
          RC=${PIPESTATUS[0]}
          [ -f /tmp/km_rc ] || echo "$RC" > /tmp/km_rc
          echo "$(( $(date +%s)-S ))" > /tmp/km_secs
          echo "MARK pipeline-end rc=$(cat /tmp/km_rc) secs=$(cat /tmp/km_secs) $(date -u +%H:%M:%S)" | tee -a /tmp/km_run.log
          kill $WPID 2>/dev/null; wait $WPID 2>/dev/null
          trap - EXIT
          if [ -n "$STORY" ]; then [ -s "out/$STORY.mp4" ] && echo ok > /tmp/km_ok; else ls out/*.mp4 >/dev/null 2>&1 && echo ok > /tmp/km_ok; fi
          exit 0

      - name: Remove key files
        if: always()
        run: rm -f gemini_key.txt gemini_key2.txt pexels_key.txt

      - name: Save voice progress back to the repo
        id: resume_state
        if: always()
        run: |
          set -euo pipefail
          # Exact allowlist; no git add -u that could commit renderer edits.
          python scripts/km_state.py progress

      - name: Save the mp4 as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.event.inputs.story_id || 'new' }}
          path: out/*.mp4
          retention-days: 3
          if-no-files-found: warn

      - name: Upload the logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: km-logs-${{ github.event.inputs.story_id || 'new' }}
          path: |
            /tmp/km_watch.log
            /tmp/km_run.log
          retention-days: 3
          if-no-files-found: warn

      - name: Upload the mp4 to Google Drive
        if: ${{ !cancelled() }}
        env:
          DRIVE_TOKEN_URL: ${{ secrets.DRIVE_TOKEN_URL }}
          DRIVE_TOKEN_SECRET: ${{ secrets.DRIVE_TOKEN_SECRET }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          set +e
          [ -f /tmp/km_ok ] || { echo "no mp4 to upload"; exit 0; }
          echo "MARK drive-upload-start $(date -u +%H:%M:%S)"
          if [ -z "$DRIVE_TOKEN_URL" ] || [ -z "$DRIVE_TOKEN_SECRET" ] || [ -z "$DRIVE_FOLDER_ID" ]; then
            echo "Drive secrets not set, skipping Drive upload. The mp4 is in Artifacts."; echo skipped > /tmp/km_drive; exit 0
          fi
          TOKLOC=$(curl -s -D - -o /dev/null --max-time 60 -X POST -H 'Content-Type: text/plain' --data "$DRIVE_TOKEN_SECRET" "$DRIVE_TOKEN_URL" | grep -i '^location:' | sed 's/^location: //I' | tr -d '\r')
          if [ -z "$TOKLOC" ]; then echo "script gave no redirect, check the URL"; fi
          sleep 2
          RESP=$(curl -s --max-time 60 "$TOKLOC")
          TOKEN=$(printf '%s' "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))" 2>/dev/null)
          if [ -z "$TOKEN" ]; then echo "Could not get a Drive token (wrong URL/secret, or the script is not deployed as Anyone)."; echo failed > /tmp/km_drive; exit 0; fi
          echo "::add-mask::$TOKEN"
          for f in out/*.mp4; do
            [ -s "$f" ] || continue
            NAME=$(basename "$f")
            EXIST=$(curl -s --max-time 30 -H "Authorization: Bearer $TOKEN" "https://www.googleapis.com/drive/v3/files?q=name%3D%27$NAME%27+and+%27$DRIVE_FOLDER_ID%27+in+parents+and+trashed%3Dfalse&fields=files(id)" | python3 -c "import sys,json;d=json.load(sys.stdin);f=d.get('files') or [];print(f[0]['id'] if f else '')" 2>/dev/null)
            if [ -n "$EXIST" ]; then echo "$NAME already in Drive (id $EXIST), skipping re-upload"; echo "ok $NAME" >> /tmp/km_drive; continue; fi
            META=$(python3 -c "import json,sys; print(json.dumps({'name':sys.argv[1],'parents':[sys.argv[2]]}))" "$NAME" "$DRIVE_FOLDER_ID")
            curl -s -D /tmp/hdr.txt -o /dev/null --max-time 60 -X POST "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&supportsAllDrives=true" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json; charset=UTF-8" -H "X-Upload-Content-Type: video/mp4" -d "$META"
            LOC=$(grep -i '^location:' /tmp/hdr.txt | head -1 | cut -d' ' -f2- | tr -d '\r\n')
            if [ -z "$LOC" ]; then echo "Drive refused to start the upload for $NAME:"; head -1 /tmp/hdr.txt; echo failed > /tmp/km_drive; continue; fi
            OUT=$(curl -s --max-time 900 -X PUT --data-binary "@$f" -H "Content-Type: video/mp4" "$LOC")
            ID=$(printf '%s' "$OUT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
            if [ -n "$ID" ]; then echo "Uploaded $NAME to Drive: https://drive.google.com/file/d/$ID/view"; echo "ok $NAME" >> /tmp/km_drive; else echo "Upload failed for $NAME"; printf '%s' "$OUT" | head -c 300; echo; echo failed > /tmp/km_drive; fi
          done
          echo "MARK drive-upload-end $(date -u +%H:%M:%S)"

      - name: Persist Drive completion before publishing
        id: drive_state
        if: ${{ !cancelled() && steps.resume_state.outcome == 'success' }}
        run: |
          set -euo pipefail
          touch /tmp/km_drive
          while read -r kind name; do
            [ "$kind" = ok ] || continue
            python scripts/km_state.py done "${name%.mp4}"
          done < /tmp/km_drive

      - name: Submit to connected channels through Buffer and Meta (soft - never fails the run)
        if: ${{ !cancelled() && steps.resume_state.outcome == 'success' && steps.drive_state.outcome == 'success' }}
        continue-on-error: true
        env:
          META_ENABLE: ${{ vars.META_ENABLE || 'false' }}
          FB_APP_ID: "2213813046222236"
          FB_PAGE_ID: "1404139492777541"
          IG_ACCOUNT_ID: "17841423978484959"
          THREADS_USERNAME: ${{ vars.THREADS_USERNAME || 'khabarminutenepal' }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PERSIST_POST_STATE: "true"
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_TO: ${{ secrets.WA_TO }}
        run: |
          set -euo pipefail
          rm -f /tmp/km_publish_result.txt
          # Durable Drive-complete queue survives failure after upload. Accepted
          # and pending receipts are never resubmitted. Legacy stories excluded.
          python scripts/km_state.py candidates > /tmp/km_candidates
          while read -r id; do
            [ -n "$id" ] || continue
            python scripts/km_publish.py "$id"
          done < /tmp/km_candidates

      - name: One WhatsApp summary per reel (at most once)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_TO: ${{ secrets.WA_TO }}
          KM_JOB_STATUS: ${{ job.status }}
        run: python scripts/km_notify.py

      - name: Preserve state diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: km-state-${{ github.run_id }}
          path: |
            out/state_attempts/*.json
            out/done/*.json
            out/buffer_receipts/*.json
            one_call_voice/
            stories/
            inbox/
            produced.json
            /tmp/km_publish_result.txt
            /tmp/km_drive
            /tmp/km_candidates
            out/notifications/*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          [ -f /tmp/km_publish_result.txt ] && cat /tmp/km_publish_result.txt >> "$GITHUB_STEP_SUMMARY"
          RC=$(cat /tmp/km_rc 2>/dev/null || echo X)
          SECS=$(cat /tmp/km_secs 2>/dev/null || echo 0)
          SHOW="$STORY"
          [ -n "$SHOW" ] || SHOW=$(ls out/*.mp4 2>/dev/null | head -1 | xargs -r -n1 basename | sed 's/\.mp4$//')
          {
            echo "## KM reel summary"
            echo "story: ${SHOW:-(none - nothing rendered)} | mode: $MODE | cores: $(nproc)"
            if [ -f /tmp/km_already_done ]; then echo "SKIP: already in Drive on latest main; no new render or message."; elif [ -f /tmp/km_ok ]; then echo "PASS: mp4 made in ${SECS}s. Download it from Artifacts at the bottom of this page."; echo "Drive upload: $(cat /tmp/km_drive 2>/dev/null | tr '\n' ' ' || echo not run)"; else echo "NOT DONE (exit $RC) after ${SECS}s. Voice progress is saved. Last lines:"; tail -25 /tmp/km_run.log 2>/dev/null; echo "Watchdog tail:"; tail -15 /tmp/km_watch.log 2>/dev/null; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Mark the run red if the reel was not made
        if: ${{ !cancelled() }}
        run: |
          if [ -f /tmp/km_ok ]; then
            RC=$(cat /tmp/km_rc 2>/dev/null || echo 1)
            [ "$RC" = 0 ] && exit 0
            echo "Some reels may be safe in Drive, but the batch did not finish (exit $RC)."
            exit 1
          fi
          if grep -q "No newly approved row found" /tmp/km_run.log 2>/dev/null; then echo "Nothing new in the Sheet: not an error."; exit 0; fi
          echo "Reel NOT made, see the summary above."
          exit 1
